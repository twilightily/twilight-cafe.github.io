name: Deploy Anna SSG site to Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Bypasses Go entirely and safely grabs the pre-compiled v0.4.0 executable
      - name: Download Stable Anna Binary
        run: |
          curl -L -o anna.tar.gz https://anna.ssg.dev/releases/latest/download/anna_$(uname -s)_$(uname -m).tar.gz
          tar -xzf anna.tar.gz
          chmod +x anna
          sudo mv anna /usr/local/bin/

      - name: Build Website
        run: anna

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './site/rendered' 

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
